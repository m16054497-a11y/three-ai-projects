[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-ai-suite"
version = "1.0.0"
description = "Three professional, distribution-ready AI engineering projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adham Sabry" }]
keywords = ["ai", "cli", "research", "bayesian", "game", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
game = [
  "fastapi>=0.162,<1",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.38,<1",
]
dev = [
  "fastapi>=0.162,<1",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.38,<1",
  "httpx>=0.28,<1",
  "ruff>=0.16,<1",
]

[project.scripts]
ai-researcher = "ai_researcher:main"
ai-scientist = "ai_scientist:main"
ai-game = "ai_game_developer:run"

[tool.setuptools]
py-modules = ["ai_researcher", "ai_scientist", "ai_game_developer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ai_researcher", "ai_scientist", "ai_game_developer"]

[tool.ruff.lint.per-file-ignores]
# The game module embeds a complete HTML/CSS/JS document in a template string.
"ai_game_developer.py" = ["E501"]
