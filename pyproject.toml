[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-ai-suite"
version = "2.0.0"
description = "Three installable AI projects: research assistant, Bayesian scientist, and game generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Adham Sabry", email = "m16054497-a11y@users.noreply.github.com" },
]
keywords = ["ai", "cli", "research", "bayesian", "game", "fastapi", "rag"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
game = [
  "fastapi>=0.162,<1",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.38,<1",
]
all = [
  "fastapi>=0.162,<1",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.38,<1",
]
dev = [
  "fastapi>=0.162,<1",
  "starlette>=1.6,<2",
  "uvicorn[standard]>=0.38,<1",
  "build>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.16,<1",
]

[project.scripts]
three-ai = "three_ai_suite.cli:main"
ai-researcher = "three_ai_suite.cli:researcher_main"
ai-scientist = "three_ai_suite.cli:scientist_main"
ai-game = "three_ai_suite.cli:game_main"

[project.urls]
Homepage = "https://github.com/m16054497-a11y/three-ai-projects"
Documentation = "https://github.com/m16054497-a11y/three-ai-projects/tree/main/docs"
Issues = "https://github.com/m16054497-a11y/three-ai-projects/issues"
Changelog = "https://github.com/m16054497-a11y/three-ai-projects/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["three_ai_suite"]

[tool.ruff.lint.per-file-ignores]
# The game module embeds a complete HTML/CSS/JS document in a template string.
"src/three_ai_suite/game.py" = ["E501"]
